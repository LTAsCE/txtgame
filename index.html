<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青春纪事·423</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-deep: #050a07;
    --bg-mid: #0a1410;
    --bg-card: rgba(10, 26, 18, 0.85);
    --green-bright: #00ff88;
    --green-mid: #00cc66;
    --green-dim: #006633;
    --green-glow: rgba(0, 255, 136, 0.4);
    --text-main: #c8ffd9;
    --text-dim: #5a9970;
    --text-bright: #ffffff;
    --warn: #ffaa00;
    --danger: #ff4466;
    --border: rgba(0, 255, 136, 0.25);
  }
  html, body {
    height: 100%;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--text-main);
    background: var(--bg-deep);
    overflow: hidden;
    user-select: none;
  }
  body {
    background:
      radial-gradient(circle at 20% 10%, rgba(0, 80, 40, 0.25), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0, 100, 50, 0.2), transparent 40%),
      linear-gradient(135deg, #050a07 0%, #0a1410 50%, #050a07 100%);
    background-attachment: fixed;
  }
  /* ============ 启动屏 ============ */
  #start-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    text-align: center;
  }
  #start-screen::before {
    content: ""; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,255,136,0.025) 2px, rgba(0,255,136,0.025) 4px),
      radial-gradient(ellipse at center, rgba(0,40,20,0.6), rgba(0,0,0,0.95));
    z-index: -1;
  }
  .game-title {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 8px;
    color: var(--green-bright);
    text-shadow: 0 0 20px var(--green-glow), 0 0 40px var(--green-glow);
    margin-bottom: 8px;
    animation: titlePulse 3s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%,100% { text-shadow: 0 0 20px var(--green-glow), 0 0 40px var(--green-glow); }
    50% { text-shadow: 0 0 30px var(--green-bright), 0 0 60px var(--green-glow); }
  }
  .game-subtitle {
    font-size: 18px; letter-spacing: 6px;
    color: var(--text-dim);
    margin-bottom: 60px;
  }
  .start-btn {
    padding: 14px 48px;
    font-size: 18px; letter-spacing: 4px;
    color: var(--green-bright);
    background: transparent;
    border: 1.5px solid var(--green-mid);
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
  }
  .start-btn:hover {
    background: rgba(0,255,136,0.15);
    box-shadow: 0 0 20px var(--green-glow);
    transform: translateY(-2px);
  }
  .start-info {
    margin-top: 40px;
    font-size: 12px; color: var(--text-dim);
    line-height: 1.8;
  }

  /* ============ 游戏主屏 ============ */
  #game-screen {
    display: none;
    height: 100vh;
    flex-direction: column;
    padding: 8px;
    gap: 8px;
  }
  #game-screen.active { display: flex; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    backdrop-filter: blur(6px);
  }
  .topbar .logo {
    font-weight: 900; color: var(--green-bright);
    letter-spacing: 2px; font-size: 14px;
    padding-right: 12px; border-right: 1px solid var(--border);
  }
  .topbar .info-pill {
    font-size: 12px; color: var(--text-main);
    padding: 3px 10px;
    border: 1px solid var(--border);
    background: rgba(0,40,20,0.4);
  }
  .topbar .info-pill b { color: var(--green-bright); }
  .topbar .spacer { flex: 1; }
  .topbar .countdown {
    font-size: 13px; color: var(--warn);
    letter-spacing: 1px;
  }

  .main-area {
    flex: 1;
    display: grid;
    grid-template-columns: 220px 1fr 220px;
    gap: 8px;
    overflow: hidden;
  }

  /* 侧栏：属性面板 */
  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    backdrop-filter: blur(6px);
    overflow-y: auto;
    padding: 10px;
  }
  .panel h3 {
    font-size: 12px; letter-spacing: 3px;
    color: var(--green-mid);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px; margin-bottom: 8px;
  }
  .attr-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; margin-bottom: 4px;
  }
  .attr-row .name { width: 78px; color: var(--text-dim); white-space: nowrap; }
  .attr-row .bar {
    flex: 1; height: 8px;
    background: rgba(0,40,20,0.6);
    border: 1px solid rgba(0,255,136,0.2);
    position: relative;
  }
  .attr-row .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green-dim), var(--green-bright));
    transition: width 0.5s ease;
  }
  .attr-row .val {
    width: 28px; text-align: right;
    color: var(--green-bright);
    font-size: 11px; font-weight: bold;
  }
  .attr-row.money .fill { background: linear-gradient(90deg, #665500, #ffaa00); }
  .attr-row.money .val { color: var(--warn); }
  .attr-row.stress .fill { background: linear-gradient(90deg, #661a00, #ff4466); }
  .attr-row.stress .val { color: var(--danger); }
  .attr-section { margin-bottom: 12px; }
  .attr-section-title {
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 2px; margin-bottom: 4px;
  }

  /* 中间内容区 */
  .scene-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .scene-bg {
    height: 38%;
    min-height: 120px;
    background-size: cover; background-position: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    display: flex; align-items: flex-end;
    padding: 12px;
  }
  .scene-bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(5,10,7,0.95), transparent 70%);
  }
  .scene-bg .scene-title {
    position: relative; z-index: 1;
    font-size: 14px; color: var(--green-bright);
    letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
  }
  .scene-bg .chapter-badge {
    position: absolute; top: 10px; right: 12px; z-index: 1;
    font-size: 11px; color: var(--green-mid);
    border: 1px solid var(--border);
    padding: 2px 8px; background: rgba(0,20,10,0.7);
    letter-spacing: 2px;
  }
  .dialogue-area {
    flex: 1;
    padding: 16px 20px;
    overflow-y: auto;
    font-size: 14px; line-height: 1.8;
  }
  .narration {
    color: var(--text-main);
    margin-bottom: 10px;
    font-style: italic;
    opacity: 0.92;
  }
  .speech {
    margin-bottom: 10px;
    padding-left: 12px;
    border-left: 2px solid var(--green-mid);
  }
  .speech .speaker {
    font-size: 12px; color: var(--green-bright);
    margin-bottom: 2px; letter-spacing: 1px;
  }
  .speech .text { color: var(--text-main); }
  .speech.teacher { border-color: var(--warn); }
  .speech.teacher .speaker { color: var(--warn); }
  .speech.female { border-color: #ff6699; }
  .speech.female .speaker { color: #ff99bb; }

  .choice-area {
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    background: rgba(0,20,10,0.4);
    max-height: 240px;
    overflow-y: auto;
  }
  .choice-area .group-label {
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 2px; margin: 6px 0 2px;
    border-bottom: 1px dashed rgba(0,255,136,0.15);
    padding-bottom: 2px;
  }
  .choice-area .char-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
  }
  .choice-area .char-grid .choice-btn {
    margin-bottom: 0;
    padding: 6px 10px;
    font-size: 12px;
  }
  .choice-prompt {
    font-size: 13px; color: var(--green-bright);
    margin-bottom: 10px; letter-spacing: 1px;
  }
  .choice-btn {
    display: block; width: 100%;
    text-align: left;
    padding: 10px 14px; margin-bottom: 6px;
    font-size: 13px;
    color: var(--text-main);
    background: rgba(0,40,20,0.5);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .choice-btn:hover:not(:disabled) {
    background: rgba(0,255,136,0.12);
    border-color: var(--green-mid);
    color: var(--green-bright);
    transform: translateX(4px);
  }
  .choice-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .choice-btn .eff {
    font-size: 10px; color: var(--text-dim);
    margin-left: 8px;
  }
  .choice-btn .eff .plus { color: var(--green-bright); }
  .choice-btn .eff .minus { color: var(--danger); }

  /* 行动按钮区 */
  .action-bar {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 6px;
    padding: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    max-height: 200px;
    overflow-y: auto;
  }
  .action-bar .action-group-label {
    grid-column: 1 / -1;
    font-size: 10px; color: var(--green-mid);
    letter-spacing: 2px;
    margin: 4px 0 2px;
    padding-bottom: 2px;
    border-bottom: 1px dashed rgba(0,255,136,0.15);
  }
  .action-btn {
    padding: 10px 8px;
    font-size: 12px;
    color: var(--text-main);
    background: rgba(0,30,15,0.6);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    text-align: center;
  }
  .action-btn:hover:not(:disabled) {
    background: rgba(0,255,136,0.12);
    border-color: var(--green-mid);
    color: var(--green-bright);
    box-shadow: 0 0 12px var(--green-glow);
  }
  .action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .action-btn .act-name { font-weight: bold; font-size: 13px; }
  .action-btn .act-eff { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  /* 右侧：好感度/角色 */
  .char-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; padding: 3px 4px;
    border-bottom: 1px dashed rgba(0,255,136,0.08);
  }
  .char-row .char-name { color: var(--text-main); }
  .char-row .char-aff { color: var(--green-bright); font-weight: bold; }
  .char-row.female .char-name { color: #ff99bb; }
  .char-row.female .char-aff { color: #ff6699; }
  .char-row.me-row {
    background: rgba(0,255,136,0.12);
    border: 1px solid var(--green-mid);
    padding: 4px 6px;
    margin-bottom: 6px;
  }
  .char-row.me-row .char-name { color: var(--green-bright); font-weight: bold; }
  .char-row.me-row .char-aff { color: var(--warn); font-size: 9px; }
  .char-group-title {
    font-size: 10px; color: var(--green-mid);
    letter-spacing: 2px;
    margin: 8px 0 2px;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--border);
  }
  .char-row .char-role {
    font-size: 9px; color: var(--warn);
    margin-left: 4px;
  }
  .panel { font-size: 11px; }

  /* ============ 结局屏 ============ */
  #end-screen {
    display: none;
    position: fixed; inset: 0;
    flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px;
    z-index: 90;
    text-align: center;
    overflow-y: auto;
  }
  #end-screen.active { display: flex; }
  .ending-title {
    font-size: 48px; font-weight: 900;
    letter-spacing: 8px;
    color: var(--green-bright);
    text-shadow: 0 0 30px var(--green-glow);
    margin-bottom: 16px;
  }
  .ending-tier {
    font-size: 16px; color: var(--warn);
    letter-spacing: 4px; margin-bottom: 24px;
  }
  .ending-text {
    max-width: 640px;
    font-size: 15px; line-height: 2;
    color: var(--text-main);
    margin-bottom: 24px;
    padding: 20px 30px;
    background: var(--bg-card);
    border: 1px solid var(--border);
  }
  .ending-stats {
    display: flex; gap: 20px;
    margin-bottom: 30px;
    font-size: 12px; color: var(--text-dim);
  }
  .ending-stats span b { color: var(--green-bright); font-size: 16px; }
  .ending-extras {
    max-width: 640px; width: 100%;
    margin-bottom: 30px;
    text-align: left;
    font-size: 13px; line-height: 1.9;
    color: var(--text-main);
  }
  .ending-extras .extra-line {
    padding: 6px 10px; margin-bottom: 4px;
    border-left: 2px solid var(--green-mid);
    background: rgba(0,30,15,0.4);
  }
  .restart-btn {
    padding: 12px 40px;
    font-size: 14px; letter-spacing: 4px;
    color: var(--green-bright);
    background: transparent;
    border: 1.5px solid var(--green-mid);
    cursor: pointer;
    font-family: inherit;
  }
  .restart-btn:hover {
    background: rgba(0,255,136,0.15);
    box-shadow: 0 0 20px var(--green-glow);
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,20,10,0.4); }
  ::-webkit-scrollbar-thumb { background: var(--green-dim); }
  ::-webkit-scrollbar-thumb:hover { background: var(--green-mid); }

  /* Toast */
  #toast {
    position: fixed; top: 60px; left: 50%;
    transform: translateX(-50%);
    padding: 10px 24px;
    background: rgba(5,15,10,0.95);
    border: 1px solid var(--green-mid);
    color: var(--green-bright);
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #toast .delta { display: inline-block; margin: 0 6px; font-size: 11px; }
  #toast .delta.pos { color: var(--green-bright); }
  #toast .delta.neg { color: var(--danger); }

  /* 属性变更飘字 */
  .float-delta {
    position: absolute; pointer-events: none;
    font-size: 12px; font-weight: bold;
    animation: floatUp 1.5s ease-out forwards;
    z-index: 50;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-30px); }
  }
  .float-delta.pos { color: var(--green-bright); text-shadow: 0 0 8px var(--green-glow); }
  .float-delta.neg { color: var(--danger); text-shadow: 0 0 8px rgba(255,68,102,0.6); }

  @media (max-width: 900px) {
    .main-area { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    .panel { max-height: 130px; padding: 8px; }
    .panel h3 { font-size: 11px; margin-bottom: 4px; }
    .attr-row { font-size: 10px; margin-bottom: 3px; }
    .attr-row .name { width: 64px; font-size: 10px; }
    .attr-row .val { width: 24px; font-size: 10px; }
    .char-row { font-size: 10px; padding: 2px 4px; }
    .game-title { font-size: 40px; letter-spacing: 4px; }
    /* 顶栏自适应 */
    .topbar { flex-wrap: wrap; padding: 6px 8px; gap: 6px; }
    .topbar .logo { font-size: 12px; padding-right: 8px; }
    .topbar .info-pill { font-size: 10px; padding: 2px 6px; }
    .topbar .countdown { font-size: 11px; width: 100%; text-align: right; }
    /* 场景区域 */
    .scene-bg { height: 80px; min-height: 80px; padding: 8px; }
    .scene-bg .scene-title { font-size: 13px; letter-spacing: 2px; }
    .scene-bg .chapter-badge { font-size: 10px; padding: 1px 6px; }
    .dialogue-area { padding: 10px 12px; font-size: 13px; line-height: 1.6; }
    .choice-area { padding: 8px 12px 12px; max-height: 200px; }
    .choice-prompt { font-size: 12px; margin-bottom: 6px; }
    .choice-btn { padding: 8px 10px; font-size: 12px; margin-bottom: 4px; }
    .choice-area .char-grid { grid-template-columns: 1fr; }
    /* 行动按钮栏 */
    .action-bar { padding: 6px; gap: 4px; }
    .action-group-label { font-size: 9px; letter-spacing: 1px; margin: 4px 0 2px; }
    .action-btn { font-size: 12px; padding: 6px 8px; min-width: 0; }
    .action-btn .act-name { font-size: 12px; }
    .action-btn .act-eff { font-size: 9px; }
    /* 结局屏 */
    .ending-title { font-size: 30px; letter-spacing: 4px; }
    .ending-tier { font-size: 13px; letter-spacing: 2px; }
    .ending-text { font-size: 13px; padding: 14px 18px; max-width: 100%; }
    .ending-stats { flex-wrap: wrap; gap: 10px; font-size: 11px; }
    .ending-extras { font-size: 12px; }
  }

  @media (max-width: 480px) {
    /* 极小屏（手机）进一步压缩 */
    .game-title { font-size: 30px; letter-spacing: 2px; }
    .game-subtitle { font-size: 11px; }
    .start-btn { padding: 10px 30px; font-size: 14px; letter-spacing: 4px; }
    .start-info { font-size: 11px; }
    .topbar .logo { font-size: 10px; padding-right: 6px; letter-spacing: 1px; }
    .topbar .info-pill { font-size: 9px; padding: 2px 4px; }
    .topbar .countdown { font-size: 10px; }
    .panel { max-height: 110px; padding: 6px; }
    .panel h3 { font-size: 10px; letter-spacing: 2px; }
    .attr-section-title { font-size: 9px; letter-spacing: 1px; }
    .attr-row { font-size: 9px; }
    .attr-row .name { width: 56px; }
    .attr-row .bar { height: 6px; }
    .attr-row .val { width: 20px; font-size: 9px; }
    .char-group-title { font-size: 9px; letter-spacing: 1px; }
    .char-row { font-size: 9px; padding: 2px 3px; }
    .char-row .char-role { font-size: 8px; }
    .scene-bg { height: 70px; min-height: 70px; padding: 6px; }
    .scene-bg .scene-title { font-size: 11px; letter-spacing: 1px; }
    .scene-bg .chapter-badge { font-size: 9px; padding: 1px 4px; }
    .dialogue-area { padding: 8px 10px; font-size: 12px; line-height: 1.5; }
    .narration { margin-bottom: 6px; font-size: 11px; }
    .speech { padding-left: 8px; margin-bottom: 6px; }
    .speech .speaker { font-size: 10px; }
    .speech .text { font-size: 12px; }
    .choice-area { padding: 6px 10px 10px; max-height: 180px; }
    .choice-prompt { font-size: 11px; margin-bottom: 4px; }
    .choice-btn { padding: 6px 8px; font-size: 11px; margin-bottom: 3px; }
    .action-bar { padding: 4px; gap: 3px; }
    .action-group-label { font-size: 8px; margin: 3px 0 1px; }
    .action-btn { font-size: 11px; padding: 5px 6px; }
    .action-btn .act-name { font-size: 11px; }
    .action-btn .act-eff { font-size: 8px; }
    .ending-title { font-size: 22px; letter-spacing: 2px; }
    .ending-tier { font-size: 11px; }
    .ending-text { font-size: 12px; padding: 10px 12px; line-height: 1.7; }
    .ending-stats span b { font-size: 13px; }
    .ending-extras { font-size: 11px; }
    .restart-btn { padding: 10px 24px; font-size: 12px; letter-spacing: 2px; }
  }
</style>
</head>
<body>

<!-- ========== 启动屏 ========== -->
<div id="start-screen">
  <div class="game-title">青春纪事</div>
  <div class="game-subtitle">423 势力 · 2013—2015</div>
  <button class="start-btn" id="btn-start">开 始 故 事</button>
  <div class="start-info">
    湘潭县一中 · 高二（423班）→ 高考<br>
    自由选择 / 数值养成 / 好感度 / 多结局<br>
    主角性别：男（固定）
  </div>
</div>

<!-- ========== 游戏主屏 ========== -->
<div id="game-screen">
  <div class="topbar">
    <div class="logo">青春纪事·423</div>
    <div class="info-pill">日期：<b id="info-date">2013.09.01</b></div>
    <div class="info-pill">时段：<b id="info-slot">早读</b></div>
    <div class="info-pill">章节：<b id="info-chapter">序章</b></div>
    <div class="spacer"></div>
    <div class="info-pill">宿舍：<b id="info-dorm">—</b></div>
    <div class="countdown" id="info-countdown">距高考 645 天</div>
  </div>

  <div class="main-area">
    <!-- 左：属性面板 -->
    <div class="panel" id="attr-panel">
      <h3>属 性</h3>
      <div id="attr-list"></div>
    </div>

    <!-- 中：场景/对话/选择 -->
    <div class="scene-box">
      <div class="scene-bg" id="scene-bg">
        <div class="chapter-badge" id="scene-chapter">序章</div>
        <div class="scene-title" id="scene-title">湘潭县一中</div>
      </div>
      <div class="dialogue-area" id="dialogue-area"></div>
      <div class="choice-area" id="choice-area"></div>
    </div>

    <!-- 右：角色好感度 -->
    <div class="panel">
      <h3>人 物</h3>
      <div id="char-list"></div>
    </div>
  </div>

/* ---------- 日期计算 ---------- */
function getDateStr() {
  // 起始 2013.09.01
  const start = new Date(2013, 8, 1);
  const cur = new Date(start);
  cur.setDate(start.getDate() + state.day - 1);
  const y = cur.getFullYear();
  const m = String(cur.getMonth()+1).padStart(2,"0");
  const d = String(cur.getDate()).padStart(2,"0");
  return `${y}.${m}.${d}`;
}

function getCountdown() {
  // 高考 2015.06.07
  const start = new Date(2013, 8, 1);
  const gao = new Date(2015, 5, 7);
  const cur = new Date(start);
  cur.setDate(start.getDate() + state.day - 1);
  const diff = Math.ceil((gao - cur) / 86400000);
  return diff;
}

/* 把 state.day 跳转到目标日期（y, m: 1-12, d），用于章节推进时让日期与剧情同步 */
function jumpGameDate(y, m, d) {
  const start = new Date(2013, 8, 1);
  const target = new Date(y, m - 1, d);
  const diff = Math.round((target - start) / 86400000) + 1; // day=1 对应 09.01
  if (diff > state.day) {
    const jumped = diff - state.day;
    state.day = diff;
    state.slot = 0;
    addNarrationToDialogue(`📅 时光飞逝，转眼到了 ${y}.${String(m).padStart(2,"0")}.${String(d).padStart(2,"0")}（跳过 ${jumped} 天）。`);
  }
}

      const v = state.attrs[a.key] || 0;
      const pct = Math.min(100, v);

      html += `<div class="attr-row ${cls}">
        <div class="name">${a.name}</div>
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="val">${v}</div>

function renderChars() {

  const groups = {};

    const c = CHARACTERS[id];
    let g = c.dorm ? `${c.dorm}宿舍` : `女生·${c.type}`;
    if (c.dorm === "走读") g = "走读生";

    if (!groupOrder.includes(g)) g = "女生·社交型";

    groups[g].push({ id, c });
  });
  groupOrder.forEach(g => {
    if (!groups[g] || !groups[g].length) return;
    html += `<div class="char-group-title">${g}</div>`;
    groups[g].forEach(({id, c}) => {
      const aff = state.affections[id] || 0;
      const isF = c.gender === "female";

      html += `<div class="char-row ${isF?'female':''}">
        <span class="char-name">${c.name}${c.role?`<span class="char-role">[${c.role}]</span>`:""}${star}</span>
        <span class="char-aff">${aff}</span>
      </div>`;
    });
  });
  document.getElementById("char-list").innerHTML = html;
}

/* ---------- 应用效果 ---------- */
function applyEffects(eff, silent=false) {
  if (!eff) return;
  const deltas = [];
  Object.keys(eff).forEach(k => {
    let key = k;
    // 好感度后缀
    if (k.endsWith("_affection")) {
      const charId = k.replace("_affection","");
      if (state.affections[charId] !== undefined) {
        state.affections[charId] = Math.max(0, state.affections[charId] + eff[k]);
        if (!silent) deltas.push({ name: CHARACTERS[charId]?.name + "好感", v: eff[k] });
      }
      return;
    }
    if (state.attrs[key] !== undefined) {
      state.attrs[key] = Math.max(0, Math.min(ATTRS.find(a=>a.key===key)?.max || 100, state.attrs[key] + eff[k]));
      if (!silent) deltas.push({ name: ATTRS.find(a=>a.key===key)?.name || key, v: eff[k] });
    } else if (key === "money") {
      state.attrs.money = Math.max(0, (state.attrs.money||0) + eff[k]);
      if (!silent) deltas.push({ name: "💰 零花钱", v: eff[k] });
    } else if (key === "stress") {
      state.attrs.stress = Math.max(0, (state.attrs.stress||0) + eff[k]);
      if (!silent) deltas.push({ name: "😵 压力", v: eff[k] });
    }
  });
  if (!silent && deltas.length) showToast(deltas);
  renderAttrs();
  renderChars();
}

function showToast(deltas) {
  const t = document.getElementById("toast");
  let html = "";
  deltas.forEach(d => {
    const cls = d.v >= 0 ? "pos" : "neg";
    const sign = d.v >= 0 ? "+" : "";
    html += `<span class="delta ${cls}">${d.name} ${sign}${d.v}</span>`;
  });
  t.innerHTML = html;
  t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- 对话渲染 ---------- */
function renderScene(scene) {
  setBackground(scene.background, scene.title || scene.id);
  const da = document.getElementById("dialogue-area");
  da.innerHTML = "";
  let idx = 0;
  function next() {
    if (idx >= scene.lines.length) {
      // 处理 choice 或 effects
      if (scene.choice) {
        renderChoice(scene.choice);
      } else if (scene.effects) {
        applyEffects(scene.effects);
        showContinueBtn(() => onSceneEnd(scene));
      } else if (scene.conditional) {
        // 条件分支
        let matched = null;
        for (const c of scene.conditional) {
          if (evalCondition(c.if)) { matched = c; break; }
        }
        if (!matched) matched = scene.conditional[scene.conditional.length-1];
        addNarration(matched.text);
        showContinueBtn(() => onSceneEnd(scene, matched.next));
      } else {
        showContinueBtn(() => onSceneEnd(scene));
      }
      return;
    }
    const line = scene.lines[idx]; idx++;
    if (line.type === "narration") {
      addNarration(line.text);
      next();
    } else if (line.type === "character") {
      addSpeech(line.char, line.text, line.emotion);
      next();
    } else if (line.type === "choice") {
      renderChoice(line);
    } else if (line.type === "effects") {
      applyEffects(line.changes);
      next();
    } else if (line.type === "conditional") {
      let matched = null;
      for (const c of line.conditions) if (evalCondition(c.if)) { matched = c; break; }
      if (!matched) matched = line.conditions[line.conditions.length-1];
      addNarration(matched.text);
      next();
    } else {
      next();
    }
  }
  next();
}

function addNarration(text) {
  const da = document.getElementById("dialogue-area");
  const d = document.createElement("div");
  d.className = "narration";
  // 替换占位符
  let t = text;
  if (state.playerCharId) {
    const pc = CHARACTERS[state.playerCharId];
    t = t.replace(/{_player_name}/g, pc?.name || "我");
    t = t.replace(/{_player_ref}/g, pc?.ref || "—");
    t = t.replace(/{_player_hobby}/g, pc?.hobby || "—");
  }
  if (state.dorm) {
    t = t.replace(/{_dorm_name}/g, DORMS[state.dorm]?.name || state.dorm);
  }
  d.textContent = t;
  da.appendChild(d);
  da.scrollTop = da.scrollHeight;
}

function addSpeech(char, text, emotion) {
  const da = document.getElementById("dialogue-area");
  const d = document.createElement("div");
  let cls = "speech";
  let speaker = char;
  if (char === "TEACHER") {
    cls += " teacher";
    // 高二（章节1-3）：陈老师·语文·女；高三（章节4-5）：刘老师·数学·男
    if (state.chapter >= 4) speaker = "刘老师（班主任·数学）";
    else { speaker = "陈老师（班主任·语文）"; cls += " female"; }
  }
  else if (char === "PROTAGONIST") { cls += ""; speaker = state.playerCharId ? `${CHARACTERS[state.playerCharId].name}（我）` : "我"; }
  else {
    // 查找角色
    const found = Object.values(CHARACTERS).find(c => c.name === char);
    if (found && found.gender === "female") cls += " female";
    speaker = char;
  }
  d.className = cls;
  d.innerHTML = `<div class="speaker">${speaker}</div><div class="text">${text}</div>`;
  da.appendChild(d);
  da.scrollTop = da.scrollHeight;
}

function renderChoice(choice) {
  const ca = document.getElementById("choice-area");
  ca.innerHTML = `<div class="choice-prompt">▸ ${choice.prompt}</div>`;
  // 动态选项：全部人物
  let optionsList = choice.options;
  if (optionsList === "_all_characters") {
    optionsList = buildAllCharacterOptions();
  } else if (optionsList === "_all_males") {
    optionsList = buildMaleCharacterOptions();
  }
  // 分组渲染（如果是人物列表）
  const isCharList = optionsList.length > 0 && optionsList[0]._isChar;
  if (isCharList) {
    const groups = {};
    optionsList.forEach(o => { if (!groups[o._group]) groups[o._group] = []; groups[o._group].push(o); });
    Object.keys(groups).forEach(g => {
      const lbl = document.createElement("div");
      lbl.className = "group-label";
      lbl.textContent = `[ ${g} ]`;
      ca.appendChild(lbl);
      const grid = document.createElement("div");
      grid.className = "char-grid";
      groups[g].forEach(opt => grid.appendChild(makeChoiceBtn(opt, choice)));
      ca.appendChild(grid);
    });
  } else {
    optionsList.forEach(opt => ca.appendChild(makeChoiceBtn(opt, choice)));
  }
}

function makeChoiceBtn(opt, choice) {
  const btn = document.createElement("button");
  btn.className = "choice-btn";
  let effHtml = "";
  if (opt.effects) {
    const parts = [];
    Object.keys(opt.effects).forEach(k => {
      const v = opt.effects[k];
      const sign = v >= 0 ? "+" : "";
      const cls = v >= 0 ? "plus" : "minus";
      let label = k;
      if (k.endsWith("_affection")) label = (CHARACTERS[k.replace("_affection","")]?.name || k) + "好感";
      else label = ATTRS.find(a => a.key === k)?.name || k;
      parts.push(`<span class="${cls}">${label} ${sign}${v}</span>`);
    });
    effHtml = `<span class="eff">[${parts.join(" · ")}]</span>`;
  }
  let disabled = false;
  if (opt.condition) disabled = !evalCondition(opt.condition);
  btn.innerHTML = `▸ ${opt.text} ${effHtml}`;
  if (disabled) { btn.disabled = true; btn.innerHTML += ` <span class="eff">[条件不足]</span>`; }
  btn.onclick = () => {
    if (opt.effects) applyEffects(opt.effects);
    if (opt.id && opt.id.startsWith("notice_")) {
      state.flags.noticedChar = opt.id.replace("notice_","");
    }
    if (opt.id && opt.id.startsWith("dorm_")) {
      state.dorm = opt.id;
      applyEffects(DORMS[opt.id].bonuses);
      renderTopbar();
    }
    // 玩家身份选择
    if (choice._key === "whoami" && CHARACTERS[opt.id]) {
      applyPlayerIdentity(opt.id);
      renderTopbar();
      renderAttrs();
      renderChars();
    }
    document.getElementById("choice-area").innerHTML = "";
    onChoiceResolved(choice, opt);
  };
  return btn;
}

function buildAllCharacterOptions() {
  const groups = {
    "212宿舍": [],
    "213宿舍": [],
    "214宿舍": [],
    "走读生": [],
    "女生·学习型": [],
    "女生·文艺型": [],
    "女生·体育型": [],
    "女生·社交型": [],
  };
  Object.keys(CHARACTERS).forEach(id => {
    const c = CHARACTERS[id];
    let g = c.dorm ? `${c.dorm}宿舍` : `女生·${c.type}`;
    if (c.dorm === "走读") g = "走读生";
    if (!c.dorm) g = `女生·${c.type}`;
    if (!groups[g]) g = "女生·社交型";
    // 前期不显示参考大学，只显示性别和爱好
    let hobby = (c.hobby && c.hobby !== "-") ? `·爱好:${c.hobby}` : "";
    let role = c.role ? `·${c.role}` : "";
    groups[g].push({
      id: `notice_${id}`,
      text: `${c.name}（${c.gender==="female"?"女":"男"}${hobby}${role}）`,
      effects: { [`${id}_affection`]: 5 },
      _isChar: true,
      _group: g
    });
  });
  const list = [];
  Object.keys(groups).forEach(g => groups[g].forEach(o => list.push(o)));
  return list;
}

/* 玩家可选的男生列表（28人，按宿舍分组） */
function buildMaleCharacterOptions() {
  const groups = { "212宿舍":[], "213宿舍":[], "214宿舍":[], "走读生":[] };
  Object.keys(CHARACTERS).forEach(id => {
    const c = CHARACTERS[id];
    if (c.gender !== "male") return;
    let g = c.dorm === "走读" ? "走读生" : `${c.dorm}宿舍`;
    if (!groups[g]) g = "212宿舍";
    // 前期不显示参考大学，只显示爱好
    let hobby = c.hobby && c.hobby !== "-" ? `·${c.hobby}` : "";
    let role = c.role ? `·${c.role}` : "";
    groups[g].push({
      id: id,
      text: `${c.name}（${id}${hobby}${role}）`,
      effects: {},
      _isChar: true,
      _group: g
    });
  });
  const list = [];
  Object.keys(groups).forEach(g => groups[g].forEach(o => list.push(o)));
  return list;
}

/* 根据所选男生应用初始加成 */
function applyPlayerIdentity(charId) {
  const c = CHARACTERS[charId];
  if (!c) return;
  state.playerCharId = charId;
  // 宿舍自动确定
  if (c.dorm === "走读") state.dorm = "day_student";
  else state.dorm = `dorm_${c.dorm}`;
  // 基于爱好的初始属性加成
  const bonus = { stamina:5, stress:0 };
  if (c.hobby && c.hobby.includes("lol")) { bonus.lol_skill = 8; bonus.game_knowledge = 3; bonus.intelligence = -2; }
  if (c.hobby && c.hobby.includes("足球")) { bonus.football = 8; bonus.sports = 4; }
  if (c.role === "足球队长") { bonus.football = 5; bonus.popularity = 5; bonus.charm = 2; }
  if (c.ref === "北京邮电大学") { bonus.intelligence = 5; bonus.math = 3; }
  if (c.ref === "来年再战") { bonus.intelligence = -2; bonus.stress = 5; }
  applyEffects(bonus, true);
  // 应用宿舍加成
  if (DORMS[state.dorm]) applyEffects(DORMS[state.dorm].bonuses, true);
}

function onChoiceResolved(choice, opt) {
  // 默认：本场景结束，触发onSceneEnd
  if (choice._onEnd) {
    choice._onEnd(opt);
  } else {
    showContinueBtn(() => onSceneEnd(currentScene));
  }
}

let currentScene = null;
function showContinueBtn(cb) {
  const ca = document.getElementById("choice-area");
  ca.innerHTML = "";
  const btn = document.createElement("button");
  btn.className = "choice-btn";
  btn.style.textAlign = "center";
  btn.textContent = "▸ 继续";
  btn.onclick = cb;
  ca.appendChild(btn);
}

/* ---------- 条件求值 ---------- */
function evalCondition(cond) {
  if (!cond) return true;
  try {
    // 简化条件语法
    // day_student: state.dorm === 'day_student'
    // chapter_X_complete: state.flags.chXComplete
    // intelligence >= 90: state.attrs.intelligence >= 90
    // intelligence >= 90 && stress <= 30
    let expr = cond
      .replace(/day_student/g, `state.dorm === 'day_student'`)
      .replace(/dorm_(\d+)/g, `state.dorm === 'dorm_$1'`)
      .replace(/player_dorm == (\d+)/g, `state.dorm === 'dorm_$1'`)
      .replace(/player_type == day_student/g, `state.dorm === 'day_student'`)
      .replace(/prologue_complete/g, `state.flags.prologueComplete`)
      .replace(/chapter_(\d)_complete/g, `state.flags.ch$1Complete`)
      .replace(/\b(intelligence|chinese|math|english|comprehensive|stamina|sports|football|lol_skill|game_knowledge|charm|eq|popularity|stress|money)\b/g, `state.attrs.$1`)
      .replace(/(\w+)_affection/g, `(state.affections['$1']||0)`);
    return !!eval(expr);
  } catch (e) {
    console.warn("条件求值失败:", cond, e);
    return false;
  }
}

/* ---------- 剧情序列 ---------- */
function startPrologue() {
  state.phase = "scene";
  state.chapter = 0;
  renderTopbar();
  hideActionBar();
  playScene("prologue_00");
}

function playScene(sceneId) {
  currentScene = SCENES[sceneId];
  if (!currentScene) { console.error("场景不存在:", sceneId); return; }
  document.getElementById("dialogue-area").innerHTML = "";
  document.getElementById("choice-area").innerHTML = "";
  state.sceneQueue = state.sceneQueue || [];
  renderScene(currentScene);
}

function onSceneEnd(scene, nextId) {
  // 推进剧情队列
  if (nextId && SCENES[nextId]) {
    playScene(nextId);
    return;
  }
  // 序章流程
  if (scene.id === "prologue_00") {
    playScene("prologue_01"); return;
  }
  if (scene.id === "prologue_01") {
    playScene("prologue_02"); return;
  }
  if (scene.id === "prologue_02") {
    playScene("prologue_03"); return;
  }
  if (scene.id === "prologue_03") {
    // 触发宿舍夜话
    const dormScene = state.dorm === "day_student" ? "day_student_night" : `dorm_${state.dorm.split("_")[1]}_night`;
    playScene(dormScene); return;
  }
  if (scene.id.startsWith("dorm_") || scene.id === "day_student_night") {
    state.flags.prologueComplete = true;
    state.chapter = 1;
    state.flags.ch1Complete = false;
    renderTopbar();
    enterFreeActionMode();
    return;
  }
  // 第一章日常
  if (scene.id === "ch1_01") { playScene("ch1_02"); return; }
  if (scene.id === "ch1_02") { playScene("ch1_03"); return; }
  if (scene.id === "ch1_03") {
    state.flags.ch1Complete = true;
    state.chapter = 2;
    renderTopbar();
    document.getElementById("toast").innerHTML = `<span class="delta pos">一年一届·秋季运动会 来了！</span>`;
    document.getElementById("toast").classList.add("show");
    setTimeout(() => document.getElementById("toast").classList.remove("show"), 2000);
    playScene("sports_meet");
    return;
  }
  // 运动会结束后进入第二章
  if (scene.id === "sports_meet") {
    state.chapter = 2;
    renderTopbar();
    document.getElementById("toast").innerHTML = `<span class="delta pos">第二章·世界杯之夏 已解锁</span>`;
    document.getElementById("toast").classList.add("show");
    setTimeout(() => document.getElementById("toast").classList.remove("show"), 2000);
    enterFreeActionMode();
    return;
  }
  // 第二章
  if (scene.id === "ch2_01") { playScene("ch2_02"); return; }
  if (scene.id === "ch2_02") { playScene("ch2_03"); return; }
  if (scene.id === "ch2_03") {
    state.flags.ch2Complete = true;
    state.flags.worldCupWatched = true;
    state.chapter = 3;
    renderTopbar();
    document.getElementById("toast").innerHTML = `<span class="delta pos">校园歌手大赛 来了！</span>`;
    document.getElementById("toast").classList.add("show");
    setTimeout(() => document.getElementById("toast").classList.remove("show"), 2000);
    playScene("singing_contest");
    return;
  }
  // 歌手大赛结束后进入第三章
  if (scene.id === "singing_contest") {
    state.chapter = 3;
    renderTopbar();
    document.getElementById("toast").innerHTML = `<span class="delta pos">第三章·英雄联盟S4 已解锁</span>`;
    document.getElementById("toast").classList.add("show");
    setTimeout(() => document.getElementById("toast").classList.remove("show"), 2000);
    enterFreeActionMode();
    return;
  }
  // 第三章
  if (scene.id === "ch3_01") { playScene("ch3_02"); return; }
  if (scene.id === "ch3_02") {
    state.flags.ch3Complete = true;
    state.flags.s4Watched = true;
    state.chapter = 4;
    renderTopbar();
    document.getElementById("toast").innerHTML = `<span class="delta pos">终章·高三与高考 已解锁</span>`;
    document.getElementById("toast").classList.add("show");
    setTimeout(() => document.getElementById("toast").classList.remove("show"), 2000);
    enterFreeActionMode();
    return;
  }
  // 终章
  if (scene.id === "ch4_01") {
    // 进入高考前最后一段自由行动（少量）
    enterFinalPrepAfterCh4_01();
    return;
  }
  if (scene.id === "ch4_02") {
    // 已经在onSceneEnd里通过nextId处理
    return;
  }
  if (scene.id === "ch4_good" || scene.id === "ch4_mid" || scene.id === "ch4_bad") {
    playScene("ch4_end"); return;
  }
  if (scene.id === "ch4_end") {
    showEnding();
    return;
  }
  // 默认：回到自由行动
  enterFreeActionMode();
}

/* ---------- 自由行动模式 ---------- */
function enterFreeActionMode() {
  state.phase = "freeAction";
  document.getElementById("dialogue-area").innerHTML = `<div class="narration">▸ 自由行动时段。选择一项行动来推进时间。</div>`;
  document.getElementById("choice-area").innerHTML = "";
  setBackground(state.dorm === "day_student" ? "bedroom_night" : "classroom", "自由时段");
  renderActionBar();
  checkChapterTrigger();
}

function enterFinalPrep() {
  state.phase = "freeAction";
  setBackground("classroom", "高考前·最后冲刺");
  document.getElementById("dialogue-area").innerHTML = `<div class="narration">▸ 高考在即，最后再做几次努力。</div>`;
  document.getElementById("choice-area").innerHTML = "";
  // 只允许学习类行动 + 休息
  renderActionBar(true);
}

function renderActionBar(finalOnly=false) {
  const bar = document.getElementById("action-bar");
  bar.innerHTML = "";
  let list = ACTIONS.slice();
  if (finalOnly) {
    list = list.filter(a => ["study","study_math","study_eng","study_comp","sleep","run"].includes(a.id));
  } else {
    // 按当前时段过滤：只显示该时段可用的行动
    list = list.filter(a => !a.slots || a.slots.includes(state.slot));
  }
  // 按 tag 分组
  const groupOrder = [undefined, "运动", "社团", "食堂", "购物", "风险"];
  const groupLabel = {
    undefined:"📚 学习/日常",
    "运动":"⚽ 运动",
    "社团":"🎭 社团",
    "食堂":"🍚 食堂",
    "购物":"🛒 购物（世纪星/报刊亭）",
    "风险":"⚡ 风险行动",
  };
  // 添加分类标签
  groupOrder.forEach(g => {
    const items = list.filter(a => (a.tag||undefined) === g);
    if (!items.length) return;
    const lbl = document.createElement("div");
    lbl.className = "action-group-label";
    lbl.textContent = `[ ${groupLabel[g]} ]`;
    bar.appendChild(lbl);
    items.forEach(a => bar.appendChild(makeActionBtn(a)));
  });
  updateActionAvailability();
}

function makeActionBtn(a) {
  const btn = document.createElement("button");
  btn.className = "action-btn";
  btn.dataset.id = a.id;
  let effStr = "";
  if (a.eff) {
    effStr = Object.keys(a.eff).map(k => {
      const v = a.eff[k];
      const sign = v >= 0 ? "+" : "";
      const name = ATTRS.find(x => x.key === k)?.name || k;
      return `${name}${sign}${v}`;
    }).join(" ");
  }
  let costStr = a.cost ? ` · 花${a.cost.money||0}元` : "";
  btn.innerHTML = `<div class="act-name">${a.name}</div><div class="act-eff">${effStr}${costStr}</div>`;
  btn.onclick = () => onActionClick(a);
  return btn;
}

function updateActionAvailability() {
  const btns = document.querySelectorAll(".action-btn");
  btns.forEach(btn => {
    const id = btn.dataset.id;
    const a = ACTIONS.find(x => x.id === id);
    if (!a) return;
    let disabled = false;
    if (a.cost && a.cost.money && (state.attrs.money||0) < a.cost.money) disabled = true;
    btn.disabled = disabled;
  });
}

function hideActionBar() {
  document.getElementById("action-bar").innerHTML = "";
}

function onActionClick(action) {
  if (state.phase !== "freeAction") return;
  // 检查花费
  if (action.cost && action.cost.money && (state.attrs.money||0) < action.cost.money) {
    showToast([{name:"零花钱不足", v:0}]);
    return;
  }
  // 如果行动支持同伴选择，先选同伴
  if (action.companion && !action._skipCompanion) {
    showCompanionPicker(action);
    return;
  }
  // 扣除花费
  if (action.cost && action.cost.money) state.attrs.money -= action.cost.money;
  // 处理特殊效果
  if (action.special === "lottery") {
    // 买彩票：30%概率中奖
    const win = Math.random() < 0.3;
    if (win) {

      state.attrs.money = Math.max(0, (state.attrs.money||0) - fine);

      state.attrs.english = Math.max(0, (state.attrs.english||0) - 2);
      state.attrs.stress = (state.attrs.stress||0) + 10;
      showToast([{name:`被抓！-${fine}元`, v:-fine}]);
      addNarrationToDialogue(`🚨 半夜溜去网吧，被宿管查寝发现！通报批评，家长被叫来学校。零花钱 -${fine}，智力 -3，数学/英语各 -2，压力 +10。`);

  }
  applyEffects(action.eff);
  // 推进时间
  advanceTime();
}

/* ---------- 同伴选择系统 ---------- */
/* 返回某角色对该行动的意愿："yes"/"no"/"maybe" */
function getWillingness(charId, action) {
  const c = CHARACTERS[charId];
  if (!c) return "no";
  if (charId === state.playerCharId) return "no"; // 不能选自己
  const tag = action.tag || "";
  const id = action.id;
  // 食堂吃饭：所有人都愿意
  if (tag === "食堂") return "yes";
  // 学习类
  if (id.startsWith("study") || id === "read_mag" || id === "buy_ref_book") {
    // 好学生愿意，其他 50%
    if (c.type === "学习型") return "yes";
    if (c.dorm === "212" && c.hobby === "-") return "yes";
    if (charId === "kuangruifeng" || charId === "zhaochenglin" || charId === "tangyufeng") return "yes";
    if (c.hobby && c.hobby.includes("lol")) return "maybe";
    return "maybe";
  }
  // 运动类
  if (tag === "运动") {
    if (c.hobby && (c.hobby.includes("足球") || c.hobby.includes("体育"))) return "yes";
    if (c.type === "体育型") return "yes";
    if (charId === "chenletian" || charId === "fengzihao" || charId === "husiren" || charId === "yinyuhao") return "yes";
    return "maybe";
  }
  // 社团
  if (tag === "社团") {
    if (id === "club_xingyun") {
      // 星云网络社：陈乐天、旷锐锋是核心
      if (charId === "chenletian" || charId === "kuangruifeng") return "yes";
      if (c.hobby && c.hobby.includes("lol")) return "yes";
      return "maybe";
    }
    if (id === "club_radio") {
      // 广播站：旷锐锋是核心
      if (charId === "kuangruifeng") return "yes";
      if (c.type === "文艺型") return "yes";
      return "maybe";
    }
  }
  // 风险行动
  if (tag === "风险") {
    if (id === "sneak_netbar") {
      // 半夜溜网吧：只有 LOL爱好者/坏学生愿意
      if (c.dorm === "213") return "yes"; // 213宿舍LOL氛围浓
      if (c.hobby && c.hobby.includes("lol")) return "yes";
      if (c.type === "社交型") return "maybe"; // 社交型女生可能叛逆
      if (c.type === "学习型") return "no"; // 好学生拒绝
      if (charId === "kuangruifeng" || charId === "zhaochenglin") return "no"; // 学霸/军校生拒绝
      return "no";
    }
    if (id === "borrow_phone") {
      // 借手机玩：LOL爱好者愿意
      if (c.hobby && c.hobby.includes("lol")) return "yes";
      if (c.dorm === "213") return "yes";
      if (c.type === "社交型") return "maybe";
      if (c.type === "学习型") return "no";
      return "maybe";
    }
  }
  // 打LOL
  if (id === "lol") {
    if (c.hobby && c.hobby.includes("lol")) return "yes";
    if (c.dorm === "213" || c.dorm === "214") return "yes";
    return "maybe";
  }
  // 看比赛
  if (id === "watch_match") {
    if (c.hobby && (c.hobby.includes("足球") || c.hobby.includes("lol"))) return "yes";
    return "maybe";
  }
  // 聊天/买零食/买饮料：所有人都愿意
  if (id === "chat" || id === "buy_snack" || id === "buy_drink") return "yes";
  // 跑步
  if (id === "run") {
    if (charId === "chenletian" || charId === "yinyuhao" || charId === "zhaochenglin") return "yes";
    return "maybe";
  }
  return "maybe";
}

/* 显示同伴选择面板 */
function showCompanionPicker(action) {
  const da = document.getElementById("dialogue-area");
  da.innerHTML = "";
  // 标题
  const title = document.createElement("div");
  title.className = "narration";
  title.textContent = `👥 ${action.name} —— 和谁一起？`;
  da.appendChild(title);
  // 提示
  const hint = document.createElement("div");
  hint.className = "narration";
  hint.style.fontSize = "11px";
  hint.style.color = "var(--text-dim)";
  hint.textContent = action.tag === "食堂" ? "（食堂可邀请多人同桌，每人 +2 好感）" : "（不同人会有不同回应；好学生通常不会去网吧）";
  da.appendChild(hint);
  // 选择区
  const choiceArea = document.getElementById("choice-area");
  choiceArea.innerHTML = "";
  choiceArea.style.display = "block";
  // 食堂行动：支持多选同伴
  if (action.tag === "食堂") {
    return showMultiCompanionPicker(action);
  }
  // "独自一人"按钮
  const aloneBtn = document.createElement("button");
  aloneBtn.className = "choice-btn";
  aloneBtn.textContent = "🚶 独自一人";
  aloneBtn.style.marginBottom = "6px";
  aloneBtn.onclick = () => {
    choiceArea.innerHTML = "";
    addNarrationToDialogue(`🚶 你独自${action.name}。`);
    executeAction(action, null);
  };
  choiceArea.appendChild(aloneBtn);
  // 候选角色：优先 KEY_CHARS 和同宿舍
  const candidates = [];
  Object.keys(CHARACTERS).forEach(id => {
    if (id === state.playerCharId) return;
    const c = CHARACTERS[id];
    // 只显示部分关键角色 + 同宿舍 + 已有互动的
    const isKey = KEY_CHARS.includes(id);
    const isSameDorm = c.dorm && state.dorm && c.dorm === DORMS[state.dorm]?.name?.replace("宿舍","");
    const aff = state.affections[id] || 0;
    if (!isKey && !isSameDorm && aff < 10) return;
    const w = getWillingness(id, action);
    candidates.push({ id, c, w });
  });
  // 按意愿分组：愿意/可能/拒绝
  const willing = candidates.filter(x => x.w === "yes");
  const maybe = candidates.filter(x => x.w === "maybe");
  const refuse = candidates.filter(x => x.w === "no");
  // 渲染
  if (willing.length) {
    const lbl = document.createElement("div");
    lbl.className = "group-label";
    lbl.textContent = "✅ 愿意同行";
    choiceArea.appendChild(lbl);
    const grid = document.createElement("div");
    grid.className = "char-grid";
    willing.forEach(({id, c}) => {
      grid.appendChild(makeCompanionBtn(id, c, action, "yes"));
    });
    choiceArea.appendChild(grid);
  }
  if (maybe.length) {
    const lbl = document.createElement("div");
    lbl.className = "group-label";
    lbl.textContent = "❓ 看情况（可能拒绝）";
    choiceArea.appendChild(lbl);
    const grid = document.createElement("div");
    grid.className = "char-grid";
    maybe.forEach(({id, c}) => {
      grid.appendChild(makeCompanionBtn(id, c, action, "maybe"));
    });
    choiceArea.appendChild(grid);
  }
  if (refuse.length) {
    const lbl = document.createElement("div");
    lbl.className = "group-label";
    lbl.textContent = "❌ 不会答应";
    choiceArea.appendChild(lbl);
    const grid = document.createElement("div");
    grid.className = "char-grid";
    refuse.forEach(({id, c}) => {
      grid.appendChild(makeCompanionBtn(id, c, action, "no"));
    });
    choiceArea.appendChild(grid);
  }
}

function makeCompanionBtn(charId, c, action, willingness) {
  const btn = document.createElement("button");
  btn.className = "choice-btn";
  const aff = state.affections[charId] || 0;
  const tag = willingness === "yes" ? "✅" : (willingness === "maybe" ? "❓" : "❌");
  const role = c.role ? `[${c.role}]` : "";
  btn.innerHTML = `${tag} ${c.name} ${role} <span style="font-size:10px;color:var(--text-dim)">好感${aff}</span>`;
  btn.style.marginBottom = "3px";
  if (willingness === "no") btn.style.opacity = "0.5";
  btn.onclick = () => {
    document.getElementById("choice-area").innerHTML = "";
    // 判断是否同意
    let agreed = willingness === "yes";
    if (willingness === "maybe") {
      agreed = Math.random() < 0.5;
    }
    const resp = getCompanionResponse(charId, action, agreed);
    addNarrationToDialogue(`🎭 ${resp}`);
    if (agreed) {
      // 同意：应用行动效果 + 好感度+2
      executeAction(action, charId);
    } else {
      // 拒绝：玩家独自做（仍扣花费、推进时间，但效果减半）
      if (action.cost && action.cost.money) state.attrs.money -= action.cost.money;
      const halfEff = {};
      if (action.eff) Object.keys(action.eff).forEach(k => halfEff[k] = Math.floor(action.eff[k] / 2));
      applyEffects(halfEff);
      addNarrationToDialogue(`🚶 ${c.name}不去了，你独自完成${action.name}。`);
      advanceTime();
    }
  };
  return btn;
}

/* 食堂多选同伴面板：可勾选多个同桌，确认后一起吃饭 */
function showMultiCompanionPicker(action) {
  const choiceArea = document.getElementById("choice-area");
  // 候选
  const candidates = [];
  Object.keys(CHARACTERS).forEach(id => {
    if (id === state.playerCharId) return;
    const c = CHARACTERS[id];
    const isKey = KEY_CHARS.includes(id);
    const isSameDorm = c.dorm && state.dorm && c.dorm === DORMS[state.dorm]?.name?.replace("宿舍","");
    const aff = state.affections[id] || 0;
    if (!isKey && !isSameDorm && aff < 10) return;
    candidates.push({ id, c });
  });
  const selected = new Set();
  // 独自/确认按钮行
  const topRow = document.createElement("div");
  topRow.className = "choice-row";
  topRow.style.marginBottom = "6px";
  const aloneBtn = document.createElement("button");
  aloneBtn.className = "choice-btn";
  aloneBtn.textContent = "🚶 独自吃";
  aloneBtn.onclick = () => {
    choiceArea.innerHTML = "";
    addNarrationToDialogue(`🚶 你独自${action.name}。`);
    executeAction(action, null);
  };
  topRow.appendChild(aloneBtn);
  choiceArea.appendChild(topRow);

  const lbl = document.createElement("div");
  lbl.className = "group-label";
  lbl.textContent = "[ 勾选同桌（可多选） ]";
  choiceArea.appendChild(lbl);
  const grid = document.createElement("div");
  grid.className = "char-grid";
  candidates.forEach(({id, c}) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn multi-btn";
    const aff = state.affections[id] || 0;
    btn.innerHTML = `${c.gender==="female"?"👧":"👦"} ${c.name} <span style="font-size:10px;color:var(--text-dim)">好感${aff}</span>`;
    btn.onclick = () => {
      if (selected.has(id)) { selected.delete(id); btn.classList.remove("selected"); btn.style.background=""; }
      else { selected.add(id); btn.classList.add("selected"); btn.style.background="var(--neon-dim)"; }
    };
    grid.appendChild(btn);
  });
  choiceArea.appendChild(grid);

  const confirmRow = document.createElement("div");
  confirmRow.className = "choice-row";
  confirmRow.style.marginTop = "8px";
  const confirmBtn = document.createElement("button");
  confirmBtn.className = "choice-btn";
  confirmBtn.textContent = "✓ 确认同桌";
  confirmBtn.style.background = "linear-gradient(90deg,var(--neon),var(--neon-dim))";
  confirmBtn.onclick = () => {
    choiceArea.innerHTML = "";
    if (!selected.size) {
      addNarrationToDialogue(`🚶 你独自${action.name}。`);
      executeAction(action, null);
      return;
    }
    // 把每个同桌的 +2 好感注入 eff，再执行
    const names = [];
    [...selected].forEach(id => names.push(CHARACTERS[id].name));
    addNarrationToDialogue(`🍽️ 你和 ${names.join("、")} 一起吃饭，热闹！`);
    // 用第一个同伴作为主同伴执行（保留花费/推进），其余只加好感
    const first = [...selected][0];
    // 给其余同伴加好感
    [...selected].slice(1).forEach(id => {
      state.affections[id] = (state.affections[id]||0) + 2;
    });
    executeAction(action, first);
  };
  confirmRow.appendChild(confirmBtn);
  choiceArea.appendChild(confirmRow);
}

      showToast([{name:`被没收！-${fine}元`, v:-fine}]);
      addNarrationToDialogue(`📵 上课偷玩被老师逮个正着，手机被没收！家长来校领人，被骂了一顿。零花钱 -${fine}，智力 -2，压力 +5。`);
      advanceTime();
      return;
    }
  } else if (action.special === "sneak_netbar") {
    const caught = Math.random() < 0.25;
    if (caught) {
      const fine = 100;
      state.attrs.money = Math.max(0, (state.attrs.money||0) - fine);

      state.attrs.math = Math.max(0, (state.attrs.math||0) - 2);
      state.attrs.english = Math.max(0, (state.attrs.english||0) - 2);
      state.attrs.stress = (state.attrs.stress||0) + 10;
      showToast([{name:`被抓！-${fine}元`, v:-fine}]);
      addNarrationToDialogue(`🚨 半夜溜去网吧，被宿管查寝发现！通报批评，家长被叫来学校。零花钱 -${fine}，智力 -3，数学/英语各 -2，压力 +10。`);
      advanceTime();
      return;
    }
  }
  advanceTime();

/* ---------- 时间推进 ---------- */
function advanceTime() {
  state.slot++;
  let dayChanged = false;
  if (state.slot >= 5) {
    state.slot = 0;
    state.day++;
    dayChanged = true;
    // 每天结束：压力微调（睡眠恢复）
    if ((state.attrs.stress||0) > 0) state.attrs.stress = Math.max(0, state.attrs.stress - 2);
    if ((state.attrs.stamina||0) < 100) state.attrs.stamina = Math.min(100, state.attrs.stamina + 5);
    // 娱乐放松计划：每天额外压力-1
    if (state.monthPlan && state.monthPlan.focus === "lol" && (state.attrs.stress||0) > 0) {
      state.attrs.stress = Math.max(0, state.attrs.stress - 1);
    }
  }
  // 每月固定发放零花钱 100 元（月份变化时）
  const curMonth = getCurMonth();
  if (curMonth !== state.lastAllowanceMonth) {
    state.attrs.money = (state.attrs.money||0) + 100;
    state.lastAllowanceMonth = curMonth;
    addNarrationToDialogue(`📅 月初，家长给了 100 元零花钱。`);
    renderTopbar();
    renderAttrs();
    // 月初制定本月计划（仅自由行动阶段，且未到高考）
    if (state.phase === "freeAction" && !state.flags.ch4Complete && state.flags.prologueComplete) {
      if (state.lastPlanMonth !== curMonth) {
        state.lastPlanMonth = curMonth;
        showMonthlyPlanPanel();
        return;
      }
    }
  }
  renderTopbar();
  renderAttrs();
  // 高考前最后冲刺触发
  if (maybeTriggerGaokao()) return;
  // 月中考后随机事件（每月中旬触发一次）
  if (dayChanged && tryTriggerRandomEvent()) return;
  // 角色支线剧情触发（每日检查一次）
  if (dayChanged && tryTriggerStoryline()) return;
  // 月末考试系统（月考/期中/期末/模拟考）
  if (dayChanged && tryTriggerExam()) return;
  // 触发章节事件
  if (!checkChapterTrigger()) {
    // 普通时段继续
    if (state.phase === "freeAction") {
      document.getElementById("dialogue-area").innerHTML = `<div class="narration">▸ ${getTimeFlavorText()}</div>`;
      document.getElementById("choice-area").innerHTML = "";
      renderActionBar();
    }
  }
}

/* ---------- 当前月份 ---------- */
function getCurMonth() {
  const start = new Date(2013, 8, 1);
  const cur = new Date(start);
  cur.setDate(start.getDate() + state.day - 1);
  return cur.getMonth() + 1; // 1-12
}

/* ---------- 当前年份 ---------- */
function getCurYear() {
  const start = new Date(2013, 8, 1);
  const cur = new Date(start);
  cur.setDate(start.getDate() + state.day - 1);
  return cur.getFullYear();
}

/* ---------- 考试系统（旧逻辑已迁移至下方月末考试改造，保留triggerExamScene） ---------- */
function getCurDayOfMonth() {
  const start = new Date(2013, 8, 1);
  const cur = new Date(start);
  cur.setDate(start.getDate() + state.day - 1);
  return cur.getDate();
}

function triggerExamScene(examType) {
  state.phase = "scene";
  hideActionBar();
  const a = state.attrs;
  // 成绩计算：基础(各科加权) + 智力加成 - 压力减成 + 随机扰动
  const base = (a.chinese * 1.0 + a.math * 1.2 + a.english * 1.0 + a.comprehensive * 2.8);
  const intelBonus = (a.intelligence - 30) * 1.5;
  const stressPenalty = (a.stress || 0) * 0.5;
  const staminaBonus = (a.stamina - 50) * 0.3;
  const noise = (Math.random() * 40 - 20); // ±20随机
  const total = Math.max(0, Math.round(base + intelBonus + staminaBonus - stressPenalty + noise));
  const prev = state.lastExamScore;
  const diff = total - prev;
  state.lastExamScore = total;
  state.examCount++;
  // 计算奖励
  let reward = 0;
  let rewardAttrs = [];
  if (diff > 0) {
    // 提升：每提升10分奖励20元零花钱+智力1
    const tiers = Math.floor(diff / 10);
    reward = tiers * 20;
    if (reward > 0) {
      state.attrs.money = (state.attrs.money || 0) + reward;
      rewardAttrs.push(`💰 +${reward}元`);
    }
    if (tiers >= 1) {
      state.attrs.intelligence = Math.min(100, (state.attrs.intelligence||0) + tiers);
      rewardAttrs.push(`🧠 智力+${tiers}`);
    }
    if (tiers >= 3) {
      state.attrs.stress = Math.max(0, (state.attrs.stress||0) - 5);
      rewardAttrs.push("😌 压力-5");
    }
  }
  // 显示考试结果
  const lines = [];
  lines.push({ speaker: "📖", text: `【${examType}】成绩公布：本次总分 ${total} 分。` });
  if (prev > 0) {
    if (diff > 0) lines.push({ speaker: "📊", text: `较上次提升 ${diff} 分！` + (rewardAttrs.length ? `奖励：${rewardAttrs.join("，")}。` : "") });
    else if (diff < 0) lines.push({ speaker: "📊", text: `较上次下降 ${Math.abs(diff)} 分。继续努力。` });
    else lines.push({ speaker: "📊", text: `与上次持平。` });
  } else {
    lines.push({ speaker: "📊", text: `这是你的首次考试，分数已记录。` });
  }
  // 排名（粗略）
  const rank = Math.max(1, Math.round(60 - total / 10 + Math.random() * 5));
  lines.push({ speaker: "🏫", text: `年级排名：约 ${rank} 名。` + (rank <= 10 ? "🏆 不错！" : "") });
  const teacherName = state.chapter >= 4 ? "刘老师" : "陈老师";
  if (diff > 20) lines.push({ speaker: "👨‍🏫", text: `${teacherName}："进步神速，继续保持！"` });
  else if (diff < -20) lines.push({ speaker: "👨‍🏫", text: `${teacherName}："最近心思不在学习上？注意调整。"` });
  // 推进到结局画面
  lines.push({ speaker: "", text: "▸ 考试结束，回到日常。" });
  playSceneInline(lines);
}

/* 在自由行动中临时播放一个简单场景 */
function playSceneInline(lines) {
  // 用临时场景机制：渲染对话，结束后回到freeAction
  const da = document.getElementById("dialogue-area");
  da.innerHTML = "";
  state._inlineSceneQueue = lines.slice();
  state._inlineSceneResume = "freeAction";
  showNextInlineLine();
}

function showNextInlineLine() {
  const da = document.getElementById("dialogue-area");
  if (!state._inlineSceneQueue || !state._inlineSceneQueue.length) {
    // 结束，回到自由行动
    state.phase = "freeAction";
    renderTopbar();
    renderAttrs();
    renderChars();
    renderActionBar();
    document.getElementById("dialogue-area").innerHTML = `<div class="narration">▸ ${getTimeFlavorText()}</div>`;
    return;
  }
  const line = state._inlineSceneQueue.shift();
  const div = document.createElement("div");
  if (line.speaker) {
    div.className = "dialogue";
    div.innerHTML = `<span class="speaker">${line.speaker}</span><span class="text">${line.text}</span>`;
  } else {
    div.className = "narration";
    div.textContent = line.text;
  }
  da.innerHTML = "";
  da.appendChild(div);
  // 显示"继续"按钮
  const btnRow = document.createElement("div");
  btnRow.className = "choice-row";
  const btn = document.createElement("button");
  btn.className = "choice-btn";
  btn.textContent = "继续 ▶";
  btn.onclick = () => showNextInlineLine();
  btnRow.appendChild(btn);
  da.appendChild(btnRow);
}

/* 根据本月计划对行动效果加成（修改 eff 对象） */
function applyMonthPlanBonus(action, eff, companionId) {
  const plan = state.monthPlan;
  if (!plan) return;
  const id = action.id || "";
  // 学习类行动：study/study_math/study_eng/study_comp/read_mag/buy_ref_book
  const isStudy = id.startsWith("study") || id === "read_mag" || id === "buy_ref_book";
  const isSports = action.tag === "运动";
  const isLol = id === "lol";
  switch (plan.focus) {
    case "study":
      if (isStudy) eff.intelligence = (eff.intelligence || 0) + 1;
      break;
    case "math":
      if (id === "study_math" || id === "buy_ref_book") eff.math = (eff.math || 0) + 2;
      break;
    case "english":
      if (id === "study_eng") eff.english = (eff.english || 0) + 2;
      break;
    case "comp":
      if (id === "study_comp") eff.comprehensive = (eff.comprehensive || 0) + 2;
      break;
    case "sports":
      if (isSports) {
        Object.keys(eff).forEach(k => {
          if (["football","sports","basketball"].includes(k) && eff[k] > 0) eff[k] = Math.round(eff[k] * 1.3);
        });
      }
      break;
    case "lol":
      if (isLol) eff.lol_skill = (eff.lol_skill || 0) + 2;
      break;
    case "social":
      // 好感获取+30%
      if (companionId) {
        const k = `${companionId}_affection`;
        if (eff[k]) eff[k] = Math.round(eff[k] * 1.3);
      }
      // 重点交往对象额外+1
      if (plan.socialTarget && plan.socialTarget !== companionId) {
        eff[`${plan.socialTarget}_affection`] = (eff[`${plan.socialTarget}_affection`] || 0) + 1;
      }
      break;
    // money focus 在月初已一次性发放，此处不再处理
  }
}

  { id:"football_invite",  name:"踢球邀约",   minDay:13, maxDay:18, condition: () => true, scene:"random_football" },

function tryTriggerRandomEvent() {
  if (state.phase !== "freeAction") return false;
  if (!state.flags.prologueComplete) return false;
  if (state.flags.ch4Complete) return false; // 高考结束不再触发
  const month = getCurMonth();
  const day = getCurDayOfMonth();
  // 每月只触发一次
  if (state.lastRandomEventMonth === month && getCurYear() === state._lastRandomEventYear) return false;
  // 月中（13-18日）触发
  if (day < 13 || day > 18) return false;
  // 30%概率触发
  if (Math.random() > 0.3) return false;
  // 随机选一个满足条件的事件
  const valid = RANDOM_EVENTS.filter(e => e.condition() && day >= e.minDay && day <= e.maxDay);
  if (!valid.length) return false;
  const ev = valid[Math.floor(Math.random()*valid.length)];
  state.lastRandomEventMonth = month;
  state._lastRandomEventYear = getCurYear();
  triggerRandomEventScene(ev);
  return true;
}

function triggerRandomEventScene(ev) {
  state.phase = "scene";
  hideActionBar();
  const lines = [];
  // 找一个发起人
  let inviter = null;
  const candidates = [];
  Object.keys(CHARACTERS).forEach(id => {
    if (id === state.playerCharId) return;
    const c = CHARACTERS[id];
    if (ev.id === "netbar_invite" && c.hobby && c.hobby.includes("lol")) candidates.push(id);
    if (ev.id === "football_invite" && c.hobby && c.hobby.includes("足球")) candidates.push(id);
    if (ev.id === "basketball_invite") candidates.push(id);
    if (ev.id === "phone_borrow" && c.hobby && c.hobby.includes("lol")) candidates.push(id);
  });
  if (candidates.length) inviter = candidates[Math.floor(Math.random()*candidates.length)];
  const inviterName = inviter ? CHARACTERS[inviter].name : "同学";

  if (ev.id === "netbar_invite") {
    lines.push({ speaker: inviterName, text: "今晚极速网络有位子，开黑走起？" });
    lines.push({ type:"choice", prompt:"怎么回应？", options:[
      { id:"go", text:"走，开黑去！", effects:{ lol_skill:3, stress:-3, stamina:-3, money:-5, [inviter+"_affection"]:3 } },

    ] });
  } else if (ev.id === "football_invite") {
    lines.push({ speaker: inviterName, text: "操场有人，踢球去？" });
    lines.push({ type:"choice", prompt:"怎么回应？", options:[
      { id:"go", text:"走，踢球！", effects:{ football:4, sports:3, stamina:-4, stress:-2, [inviter+"_affection"]:3 } },
      { id:"refuse", text:"今天累了，下次", effects:{ stamina:2, [inviter+"_affection"]:-1 } },
    ] });
  } else if (ev.id === "basketball_invite") {
    lines.push({ speaker: inviterName, text: "篮球场有空，打半场去？" });
    lines.push({ type:"choice", prompt:"怎么回应？", options:[
      { id:"go", text:"走，投篮！", effects:{ sports:3, stamina:-3, charm:1, [inviter+"_affection"]:3 } },
      { id:"refuse", text:"不了，下午有作业", effects:{ intelligence:1, [inviter+"_affection"]:-1 } },

    lines.push({ type:"choice", prompt:"怎么回应？", options:[
      { id:"lend", text:"借你玩会儿", effects:{ [inviter+"_affection"]:5, lol_skill:1, stress:-1 } },
      { id:"refuse", text:"我自己还要用", effects:{ [inviter+"_affection"]:-2 } },

  playRandomEventScene(lines);
}

function playRandomEventScene(lines) {
  const da = document.getElementById("dialogue-area");
  da.innerHTML = "";
  // 第一条是对话
  let idx = 0;
  function renderNext() {
    if (idx >= lines.length) {
      // 结束，回到自由行动
      state.phase = "freeAction";
      renderTopbar(); renderAttrs(); renderChars();
      document.getElementById("dialogue-area").innerHTML = `<div class="narration">▸ ${getTimeFlavorText()}</div>`;
      document.getElementById("choice-area").innerHTML = "";
      renderActionBar();
      return;
    }
    const line = lines[idx];
    da.innerHTML = "";
    if (line.speaker) {
      const div = document.createElement("div");
      div.className = "speech";
      div.innerHTML = `<div class="speaker">${line.speaker}</div><div class="text">${line.text}</div>`;
      da.appendChild(div);
      idx++;
      const row = document.createElement("div");
      row.className = "choice-row";
      const b = document.createElement("button");
      b.className = "choice-btn";
      b.textContent = "继续 ▶";
      b.onclick = renderNext;
      row.appendChild(b);
      da.appendChild(row);
    } else if (line.type === "choice") {
      const ca = document.getElementById("choice-area");
      ca.innerHTML = `<div class="choice-prompt">▸ ${line.prompt}</div>`;
      line.options.forEach(opt => {
        const b = document.createElement("button");
        b.className = "choice-btn";
        b.textContent = opt.text;
        b.onclick = () => {
          if (opt.effects) applyEffects(opt.effects);
          ca.innerHTML = "";
          idx++;
          renderNext();
        };
        ca.appendChild(b);
      });
    } else {
      idx++;
      renderNext();
    }
  }
  renderNext();
}

/* ============================================================
 *  月末考试改造：月末触发月考，期中/期末对应月份，高三每周一模拟考
 * ============================================================ */
function tryTriggerExam() {
  if (state.phase !== "freeAction") return false;
  if (!state.flags.prologueComplete) return false;
  if (state.flags.ch4Complete) return false; // 高考后不再月考
  const month = getCurMonth();
  const year = getCurYear();
  const day = getCurDayOfMonth();
  const isHigh3 = state.chapter >= 4 || (year === 2015 && month >= 3);

  // 高三（2015.03起）：每周一模拟考（每周的第1天=周一，简化为每7天触发）
  if (isHigh3) {
    // 用 day 差计算周数
    const start = new Date(2013, 8, 1);
    const cur = new Date(start);
    cur.setDate(start.getDate() + state.day - 1);
    const dayOfWeek = cur.getDay(); // 0=周日
    // 每周一（dayOfWeek===1）触发模拟考
    if (dayOfWeek === 1 && day !== state.lastMockWeek) {
      state.lastMockWeek = day;
      state.lastExamMonth = month;
      triggerExamScene("高三模拟考");
      return true;
    }
    return false;
  }

  // 非高三：月末（每月最后一天）触发月考/期中/期末
  const lastDayOfMonth = new Date(year, month, 0).getDate();
  if (day !== lastDayOfMonth) return false;
  if (state.lastExamMonth === month && state._lastExamYear === year) return false;
  state.lastExamMonth = month;
  state._lastExamYear = year;

  let examType = "月考";
  // 期中：11月、4月
  if (month === 11 || month === 4) examType = "期中考试";
  // 期末：1月、6月
  else if (month === 1 || month === 6) examType = "期末考";
  triggerExamScene(examType);
  return true;
}

/* 检查并触发符合条件的支线剧情（每日检查一次，只触发最早匹配的一条） */
function tryTriggerStoryline() {
  if (state.phase !== "freeAction") return false;
  if (!state.flags.prologueComplete) return false;
  for (const sl of STORYLINES) {
    if (state.playedStorylines[sl.id]) continue;
    try {
      if (!eval(sl.condition)) continue;
    } catch(e) { continue; }
    // 触发该支线
    state.playedStorylines[sl.id] = true;
    playStorylineScene(sl);
    return true;
  }
  return false;
}

/* 播放支线剧情场景（复用 inline 场景机制，支持 effects/choice） */
function playStorylineScene(sl) {
  state.phase = "scene";
  hideActionBar();
  const da = document.getElementById("dialogue-area");
  da.innerHTML = "";
  const title = document.createElement("div");
  title.className = "narration";
  title.innerHTML = `🎬 <b>${sl.name}</b>`;
  da.appendChild(title);
  let idx = 0;
  function renderNext() {
    if (idx >= sl.lines.length) {
      state.phase = "freeAction";
      renderTopbar(); renderAttrs(); renderChars();
      document.getElementById("dialogue-area").innerHTML = `<div class="narration">▸ ${getTimeFlavorText()}</div>`;
      document.getElementById("choice-area").innerHTML = "";
      renderActionBar();
      return;
    }
    const line = sl.lines[idx];
    if (line.type === "narration") {
      const div = document.createElement("div");
      div.className = "narration";
      div.textContent = line.text;
      da.appendChild(div);
      idx++;
      const row = document.createElement("div");
      row.className = "choice-row";
      const b = document.createElement("button");
      b.className = "choice-btn";
      b.textContent = "继续 ▶";
      b.onclick = renderNext;
      row.appendChild(b);
      da.appendChild(row);
      da.scrollTop = da.scrollHeight;
    } else if (line.type === "character") {
      addDialogue(line.char, line.text);
      idx++;
      const row = document.createElement("div");
      row.className = "choice-row";
      const b = document.createElement("button");
      b.className = "choice-btn";
      b.textContent = "继续 ▶";
      b.onclick = renderNext;
      row.appendChild(b);
      da.appendChild(row);
      da.scrollTop = da.scrollHeight;
    } else if (line.type === "choice") {
      const ca = document.getElementById("choice-area");
      ca.innerHTML = `<div class="choice-prompt">▸ ${line.prompt}</div>`;
      line.options.forEach(opt => {
        const b = document.createElement("button");
        b.className = "choice-btn";
        b.textContent = opt.text;
        b.onclick = () => {
          if (opt.effects) applyEffects(opt.effects);
          ca.innerHTML = "";
          idx++;
          renderNext();
        };
        ca.appendChild(b);
      });
    } else if (line.type === "effects") {
      if (line.changes) applyEffects(line.changes);
      idx++;
      renderNext();
    } else {
      idx++;
      renderNext();
    }
  }
  renderNext();
}


function checkChapterTrigger() {
  // 序章完成 → 第一章日常（开学次日触发）
  if (state.flags.prologueComplete && !state.flags.ch1Complete) {
    if (state.day >= 2 && state.slot === 0) {
      jumpGameDate(2013, 9, 2);
      state.chapter = 1;
      state.phase = "scene";
      hideActionBar();
      playScene("ch1_01");
      return true;
    }
  }
  // 第一章完成 → 第二章世界杯（2014.06.12）
  if (state.flags.ch1Complete && !state.flags.ch2Complete) {
    // 玩家自由行动若干时段后触发（章节推进时日期自动跳到2014.06）
    if (state.day >= 5) {
      jumpGameDate(2014, 6, 12);
      state.chapter = 2;
      state.phase = "scene";
      hideActionBar();
      playScene("ch2_01");
      return true;
    }
  }
  // 第二章完成 → 第三章S4（2014.09.18）
  if (state.flags.ch2Complete && !state.flags.ch3Complete) {
    if (state.day >= 8) {
      jumpGameDate(2014, 9, 18);
      state.chapter = 3;
      state.phase = "scene";
      hideActionBar();
      playScene("ch3_01");
      return true;
    }
  }
  // 第三章完成 → 终章高三百日冲刺（2015.03.01）
  if (state.flags.ch3Complete && !state.flags.ch4Complete) {
    if (state.day >= 11) {
      jumpGameDate(2015, 3, 1);
      state.chapter = 4;
      state.phase = "scene";
      hideActionBar();
      playScene("ch4_01");
      return true;
    }
  }
  return false;
}

/* ---------- 结局计算 ---------- */
function calculateFinalScore() {
  const a = state.attrs;
  let base = (a.chinese * 1.5 + a.math * 1.5 + a.english * 1.5 + a.comprehensive * 3);
  let mod = 0;
  let modBreakdown = [];
  if (a.intelligence >= 90) { mod += 30; modBreakdown.push("智力≥90 +30"); }
  else if (a.intelligence <= 40) { mod -= 40; modBreakdown.push("智力≤40 -40"); }
  if (a.math >= 90) { mod += 20; modBreakdown.push("数学≥90 +20"); }
  if (a.english >= 90) { mod += 15; modBreakdown.push("英语≥90 +15"); }
  if (a.stress <= 30) { mod += 20; modBreakdown.push("压力≤30 +20"); }
  else if (a.stress >= 90) { mod -= 50; modBreakdown.push("压力≥90 -50"); }
  if (a.stamina >= 80) { mod += 10; modBreakdown.push("体力≥80 +10"); }
  else if (a.stamina <= 20) { mod -= 30; modBreakdown.push("体力≤20 -30"); }
  const maxAff = Math.max(0, ...Object.values(state.affections));
  if (maxAff >= 80) { mod += 15; modBreakdown.push("存在好感度≥80 +15"); }
  if (state.flags.worldCupWatched) { mod += 5; modBreakdown.push("看过世界杯 +5"); }
  if (state.flags.s4Watched) { mod += 5; modBreakdown.push("看过S4 +5"); }
  if (state.flags.dropoutEvent) { mod -= 100; modBreakdown.push("退学事件 -100"); }
  return { base: Math.round(base), mod: Math.round(mod), total: Math.round(base + mod), modBreakdown, maxAff };
}

function getEnding(score) {
  const t = score.total;
  if (t >= 700) return { tier:"顶级985", name:"金榜题名·清北", text:"你考上了清华大学/北京大学。423班的红榜上，你的名字在最前面。刘老师激动得差点落泪。", univ:"清华/北大" };
  if (t >= 650) return { tier:"985", name:"金榜题名·985", text:"你考上了985重点大学。刘老师在谢师宴上喝多了，说你是他的骄傲。", univ:"北邮/北理工/吉林大学" };
  if (t >= 600) return { tier:"211", name:"金榜题名·211", text:"你考上了211大学。虽然不是顶尖，但已经足够让家人骄傲。", univ:"中国地质大学/太原理工" };
  if (t >= 550) return { tier:"一本", name:"稳稳的幸福", text:"你考上了一所不错的本科。不算惊喜，但也不算遗憾。", univ:"长沙理工/湖南科技" };
  if (t >= 500) return { tier:"二本", name:"稳稳的幸福", text:"你考上了一所普通本科。不算惊喜，但也不算遗憾。", univ:"湖南商学院/湖南工程学院" };
  if (t >= 450) return { tier:"三本", name:"平凡之路", text:"你上了一所独立学院。但你知道，这只是另一段路的开始。", univ:"湖南涉外经济学院" };
  if (t >= 300) return { tier:"专科", name:"另一条路", text:"你上了专科。但你知道，这不是终点。", univ:"株洲铁道/长沙商贸" };
  return { tier:"落榜", name:"来年再战", text:"你落榜了。你选择了复读。423班有5个人和你一样，你们成了第6个，互相约定明年再见。", univ:"复读" };
}

function getExtraEndings(score) {
  const extras = [];
  const a = state.attrs;
  // 感情结局
  if ((state.affections.caozhuoer||0) >= 80 && score.total >= 500)
    extras.push("你和曹卓尔考上了同一座城市的大学。你们的故事，才刚刚开始。");
  if ((state.affections.yangling||0) >= 80 && score.total >= 500)
    extras.push("你和杨玲考上了长沙的大学。周末的五一广场，经常能看到你们。");
  // 兄弟结局
  const maleAffs = ["kuangruifeng","liuwangjing","chenhao","liugangpeng","husiren","fengzihao"].map(id => state.affections[id]||0);
  if (maleAffs.every(v => v >= 40))
    extras.push("423班的兄弟们，后来组了一个微信群。每年暑假，你们都会回县一中踢一场球。");
  // 兴趣结局
  if (a.lol_skill >= 80)
    extras.push("你加入了大学电竞社。2018年LPL夺冠那晚，你在宿舍里哭了。");
  if (a.football >= 80)
    extras.push("你成了大学足球队的主力。2014年世界杯的那个夏天，永远留在记忆里。");
  // 宿舍结局
  if (state.dorm === "dorm_212" && (state.affections.kuangruifeng||0) >= 60)
    extras.push("212宿舍的9个人，后来分散在北京、南京、武汉、西安。但每年春节，旷锐锋都会在QQ群里发红包。");
  if (state.dorm === "dorm_213" && (state.affections.chenhao||0) >= 60)
    extras.push("213宿舍的LOL战队，后来在大学里继续开黑。2018年LPL夺冠那晚，他们在群里刷了一整夜的消息。");
  if (state.dorm === "dorm_214" && (state.affections.zhaochenglin||0) >= 60)
    extras.push("214宿舍的人后来各奔东西——有人去了军校，有人复读，有人参军。但每年寒假，他们都会回县一中看望老师。");
  // 孤独结局
  const allAffs = Object.values(state.affections);
  if (allAffs.every(v => v < 30))
    extras.push("三年过去了，你发现自己除了做题，什么都没有留下。");
  return extras;
}

function showEnding() {
  const score = calculateFinalScore();
  const ending = getEnding(score);
  const extras = getExtraEndings(score);
  state.phase = "ended";
  document.getElementById("game-screen").classList.remove("active");
  const es = document.getElementById("end-screen");
  es.classList.add("active");
  // 玩家姓名与参考大学对比
  const pc = state.playerCharId ? CHARACTERS[state.playerCharId] : null;
  const playerName = pc ? pc.name : "我";
  const refUniv = pc ? pc.ref : null;
  document.getElementById("ending-title").textContent = `${playerName} · ${ending.name}`;
  let tierLine = `【${ending.tier} · 录取:${ending.univ}】`;
  if (refUniv && refUniv !== "—" && refUniv !== "来年再战") {
    // 对比参考大学
    const tierRank = {"顶级985":8,"985":7,"211":6,"一本":5,"二本":4,"三本":3,"专科":2,"落榜":1};
    const myRank = tierRank[ending.tier] || 0;
    // 简化：根据分数差距判断
    let cmp = "";
    if (score.total >= 700) cmp = `↑ 远超参考线「${refUniv}」`;
    else if (score.total >= 600) cmp = `↑ 超越参考线「${refUniv}」`;
    else if (score.total >= 450) cmp = `≈ 持平参考线「${refUniv}」`;
    else cmp = `↓ 低于参考线「${refUniv}」`;
    tierLine += `\n${cmp}`;
  } else if (refUniv === "来年再战") {
    tierLine += `\n（参考线：来年再战）`;
  }
  document.getElementById("ending-tier").textContent = tierLine;
  document.getElementById("ending-text").textContent = `${ending.text}`;
  document.getElementById("ending-stats").innerHTML = `
    <span>基础分 <b>${score.base}</b></span>
    <span>修正 <b>${score.mod >= 0 ? "+" : ""}${score.mod}</b></span>
    <span>总分 <b>${score.total}</b></span>
  `;
  let exHtml = "";
  if (pc) exHtml += `<div class="extra-line">▸ 你扮演的是 <b style="color:var(--green-bright)">${playerName}</b>（学号${state.playerCharId}），参考大学：${refUniv||"—"}，宿舍：${DORMS[state.dorm]?.name||state.dorm}</div>`;
  if (extras.length === 0) exHtml += `<div class="extra-line">（没有额外结局触发）</div>`;
  else extras.forEach(e => exHtml += `<div class="extra-line">▸ ${e}</div>`);
  // 修正明细
  if (score.modBreakdown && score.modBreakdown.length) {
    exHtml += `<div class="extra-line" style="color:var(--text-dim);font-size:11px;">▸ 修正明细：${score.modBreakdown.join(" / ")}</div>`;
  }
  document.getElementById("ending-extras").innerHTML = exHtml;
}

/* ---------- 启动 ---------- */
document.getElementById("btn-start").onclick = () => {
  document.getElementById("start-screen").style.display = "none";
  document.getElementById("game-screen").classList.add("active");
  initState();
  renderTopbar();
  renderAttrs();
  renderChars();
  startPrologue();
};

document.getElementById("btn-restart").onclick = () => {
  document.getElementById("end-screen").classList.remove("active");
  document.getElementById("start-screen").style.display = "flex";
};

/* 初始化 */
initState();
</script>
